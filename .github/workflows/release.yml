name: release

on:
  push:
    tags: ["v*"]
  # So a failed npm publish can be retried on its own. Re-running the whole
  # workflow does not work: goreleaser refuses to recreate a release that
  # already exists, so the retry fails before it reaches the publish.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to npm, without the leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Only a tag builds and uploads binaries. A manual run exists to publish to
    # npm against a release that is already there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Published after the release exists, because postinstall downloads the
  # binary from it. Reversing the order ships a package that cannot install.
  npm:
    needs: [release]
    # success() on a tag, skipped() on a manual retry where the release job did
    # not run at all.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish the npm wrapper
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          npm version "$version" --no-git-tag-version
          npm publish --access public
