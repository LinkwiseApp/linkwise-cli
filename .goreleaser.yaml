version: 2

project_name: linkwise

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/linkwise
    binary: linkwise
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # Trimmed and stripped. The version is the tag, so a bug report naming a
    # version names an exact commit.
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# A cask rather than a formula. goreleaser deprecated `brews` in v2.10: a
# formula that ships a prebuilt binary was always working against the grain of
# what a formula is for, and casks are the supported way to do it.
homebrew_casks:
  - name: linkwise
    binaries: [linkwise]
    repository:
      owner: LinkwiseApp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://linkwise.app
    description: Your Linkwise library, from the terminal
    license: MIT
    hooks:
      post:
        # The binary is not signed or notarized, so Gatekeeper quarantines
        # anything Homebrew unpacks from the release archive and the first run
        # dies with "cannot be opened". Clearing the attribute on install is
        # what every unsigned cask has to do.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/linkwise"]
          end

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
